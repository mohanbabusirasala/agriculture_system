<!DOCTYPE html>
<html>
<head>
    <title>Agricultural Regions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #216b45;
        }

        a {
            display: inline-block;
            background: #216b45;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #216b45;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f8f2;
        }
    </style>
</head>
<body>

    <h1>🗺️ Agricultural Regions</h1>

    <a href="/">← Home</a>

    <table>
        <tr>
            <th>Region ID</th>
            <th>Region Name</th>
        </tr>

        {% for region in regions %}
        <tr>
            <td>{{ region.region_id }}</td>
            <td>{{ region.region_name }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
